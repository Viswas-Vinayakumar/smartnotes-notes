<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Lecture notes</title>
<style>:root { --text:#1a1a1a; --muted:#707070; --line:#e8e8e8; --bg:#ffffff; --flag:#b45309; }
@media (prefers-color-scheme: dark) { :root { --text:#e8e8e8; --muted:#9a9a9a; --line:#333; --bg:#161616; --flag:#f59e0b; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:17px/1.75 Georgia,"Times New Roman",serif; }
.wrap { max-width:740px; margin:0 auto; padding:56px 16px 96px; }
h1,h2,h3,nav,.label,th,.session-tag,table,.strip,.check,.flag,summary { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
header { padding-bottom:20px; border-bottom:1px solid var(--text); }
header h1 { margin:0 0 6px; font-size:2.1rem; font-weight:300; }
header p, .muted { color:var(--muted); font-style:italic; font-size:.95rem; }
nav { padding:20px 0; margin-bottom:32px; border-bottom:1px solid var(--line); font-size:.92rem; }
nav h2, h2.part { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:var(--muted); }
nav ol { margin:0; padding-left:20px; columns:2; column-gap:40px; }
nav a, a { color:var(--text); }
.strip { border:1px solid var(--line); padding:4px 18px; margin-bottom:32px; }
.strip h2 { font-size:.7rem; text-transform:uppercase; letter-spacing:.16em; color:var(--muted); }
.session-tag { display:block; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
section.topic { padding-bottom:24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
section.topic h2 { margin:0 0 12px; font-size:1.3rem; font-weight:500; }
.num { color:var(--muted); font-weight:300; margin-right:12px; }
aside.prof { border-left:1px solid var(--text); padding:2px 0 2px 22px; margin:-8px 0 32px; }
aside.prof .label { font-size:.66rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:.88rem; }
th, td { text-align:left; padding:10px 12px 10px 0; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; }
tr.done td, li.done { color:var(--muted); text-decoration:line-through; }
.said, .history, .refine { color:var(--muted); font-size:.82rem; }
.flag { color:var(--flag); font-size:.82rem; margin-top:4px; }
.check { text-decoration:none; font-size:.85rem; }
details.edit summary { color:var(--muted); font-size:.75rem; cursor:pointer; }
.ts { color:var(--muted); font-size:.75rem; font-family:-apple-system,sans-serif; }
a.ts { color:var(--muted); font-size:.75rem; text-decoration:none; font-family:-apple-system,sans-serif; }
a.ts:hover { text-decoration:underline; }
dt { font-weight:600; margin-top:12px; }
ul.plain { list-style:none; padding-left:0; }
.transcript p { margin:4px 0; font-size:.92rem; }
mark { background:#fff1a8; color:inherit; padding:0 1px; border-radius:2px; cursor:pointer; }
.hl-quote { box-shadow: inset 0 -0.5em 0 #fff1a8; }
@media (prefers-color-scheme: dark) { mark { background:rgba(245,190,40,.28); } .hl-quote { box-shadow: inset 0 -0.5em 0 rgba(245,190,40,.28); } }
.hl-list li { margin:6px 0; }
.hl-jump { text-decoration:none; }
.hl-where { color:var(--muted); font-size:.78rem; font-family:-apple-system,sans-serif; margin-left:6px; }
.hl-remove { color:var(--muted); text-decoration:none; margin-left:6px; font-family:-apple-system,sans-serif; }
.hl-btn { position:absolute; z-index:10; font:12px -apple-system,sans-serif; background:var(--text); color:var(--bg);
          border:0; border-radius:4px; padding:4px 9px; cursor:pointer; opacity:.92; }
details.fold > summary { list-style:none; cursor:pointer; }
details.fold > summary::-webkit-details-marker { display:none; }
details.fold > summary h2 { display:inline-block; margin:0; padding:14px 0; }
details.fold > summary h2::before { content:"›"; display:inline-block; width:1.1em; font-size:1rem; transition:transform .3s ease-in-out; }
details.fold[open] > summary h2::before { transform:rotate(90deg); }
section > details.fold { border-bottom:1px solid var(--line); }
.count { font-weight:400; margin-left:4px; }
details.anim[open] > :not(summary) { animation:fold-in .35s ease-in-out; }
@keyframes fold-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
@media (max-width:600px) { nav ol { columns:1; } }</style></head>
<body><div class="wrap"><header><h1>Lecture notes</h1><p>Updated 2026-10-09</p></header>
